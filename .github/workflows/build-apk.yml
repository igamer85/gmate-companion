name: Build Signed gMate Companion APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode Release Keystore (if secret provided)
        env:
          KS_B64: ${{ secrets.GMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "GMATE_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "GMATE_KEYSTORE_PASS=${{ secrets.GMATE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "GMATE_KEY_ALIAS=${{ secrets.GMATE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "GMATE_KEY_PASS=${{ secrets.GMATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - name: Checksum & Upload APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          sha256sum "$APK" > apk-sha256.txt
          cat apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gmate-companion-apk
          path: |
            app/build/outputs/apk/**/*.apk
            apk-sha256.txt
